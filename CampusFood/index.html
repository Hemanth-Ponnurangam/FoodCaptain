<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusFood</title>

  <!-- Premium Typography: Playfair Display for headings, Inter for UI text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1 class="logo">CampusFood</h1>
  </header>

  <main>

    <!-- View 1: Login -->
    <section id="login-view" class="spa-view">
      <div class="card">
        <h2>Sign In</h2>
        <p class="subtitle">Welcome back. Please sign in to continue.</p>

        <p id="login-error" class="form-error hidden"></p>

        <form id="login-form">
          <input type="text" id="login-name" placeholder="Full Name" required>
          <input type="password" id="login-password" placeholder="Password" required>
          <button type="submit" class="btn-primary">Log In</button>
        </form>

        <a href="#" class="auth-link" onclick="switchTab('signup'); return false;">Don't have an account? Sign Up</a>
      </div>
    </section>

    <!-- View 2: Sign Up -->
    <section id="signup-view" class="spa-view hidden">
      <div class="card">
        <h2>Sign Up</h2>
        <p class="subtitle">Create an account to get started.</p>

        <p id="signup-error" class="form-error hidden"></p>

        <form id="signup-form">
          <input type="text" id="signup-name" placeholder="Full Name" required>
          <input type="password" id="signup-password" placeholder="Password" required minlength="3">
          <button type="submit" class="btn-primary">Sign Up</button>
        </form>

        <a href="#" class="auth-link" onclick="switchTab('login'); return false;">Already have an account? Log In</a>
      </div>
    </section>

    <!-- View 3: Home -->
    <section id="home-view" class="spa-view hidden">
      <div class="card home-card">
        <div class="home-header">
          <div>
            <h2>Welcome<span id="home-username"></span></h2>
            <p class="subtitle">You're logged in.</p>
          </div>
          <button id="logout-btn" class="btn-secondary">Log Out</button>
        </div>
        <div class="menu-placeholder">
          <p>Food Menu</p>
        </div>
      </div>
    </section>

  </main>

  <!-- Scripts -->
  <script src="js/firebase-config.js" type="module"></script>
  <script src="js/app.js" type="module"></script>
</body>
</html>
