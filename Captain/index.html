<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - CampusFood</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/app.js" defer></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>CampusFood</h1>
            <div id="user-info">
                <button id="logout-btn">Sign Out</button>
            </div>
        </header>

        <section id="dashboard-section">
            <h2>Today's Dinner</h2>
            <p>Deadline: 4:00 PM</p>
            <div class="menu-options">
                <div class="option-card">
                    <h3>Usual Menu</h3>
                    <p>Chappati, Rajma Masala, White Rice</p>
                    <p><strong>Rs. 65.00</strong></p>
                    <button class="vote-btn" data-type="usual">Select Usual</button>
                </div>
                <div class="option-card special">
                    <h3>Chicken Biryani</h3>
                    <p>Requires a minimum of 10 votes.</p>
                    <p><strong>Rs. 125.00</strong></p>
                    <button class="vote-btn" data-type="special">Vote for Biryani</button>
                    <div class="progress-container" style="margin-top:15px; font-size: 14px;">
                        <p style="margin-bottom:5px;">Votes: <span id="current-votes">0</span> / 10</p>
                        <div class="progress-bar" style="background:#e6f0eb; height:8px; border-radius:4px;">
                            <div class="progress-fill" id="vote-progress" style="background:var(--primary-green); height:100%; width:0%; border-radius:4px;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section id="stats-section">
            <h2>Live Prep Stats</h2>
            <table class="stats-table">
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Count</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Usual Menu</td>
                        <td id="stat-usual">0</td>
                        <td>Confirmed</td>
                    </tr>
                    <tr>
                        <td>Chicken Biryani</td>
                        <td id="stat-special">0</td>
                        <td id="stat-special-status">Pending</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </div>
</body>
</html>
