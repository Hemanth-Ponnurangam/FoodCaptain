<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Food Manager</title>
  
  <!-- Premium Typography: Playfair Display for headings, Inter for UI text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1 class="logo">CampusFood</h1>
  </header>

  <main>
    <!-- Navigation Tabs -->
    <div class="tab-navigation">
      <button id="nav-login" class="tab-button active" onclick="switchTab('login')">Sign In</button>
      <button id="nav-stats" class="tab-button" onclick="switchTab('stats')">Live Prep Stats</button>
    </div>

    <!-- View 1: Auth Section -->
    <section id="login-view" class="spa-view">
      <div class="card">
        <h2>Sign In</h2>
        <p class="subtitle">Welcome back. Please sign in to cast your meal vote.</p>
        
        <form id="login-form">
          <input type="email" id="email" placeholder="Email Address" required>
          <input type="password" id="password" placeholder="Password" required>
          <button type="submit" class="btn-primary">Log In</button>
        </form>
        
        <a href="#" class="auth-link">Don't have an account? Sign Up</a>
      </div>
    </section>

    <!-- View 2: Stats Section -->
    <section id="stats-view" class="spa-view hidden">
      <div class="card">
        <h2>Live Prep Stats</h2>
        <p class="subtitle">Real-time headcount for the canteen team.</p>
        
        <table class="stats-table">
          <thead>
            <tr>
              <th>Item</th>
              <th>Count</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Usual Menu</td>
              <td>0</td>
              <td>Confirmed</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Scripts -->
  <script src="js/firebase-config.js" type="module"></script>
  <script src="js/app.js" type="module"></script>
</body>
</html>
