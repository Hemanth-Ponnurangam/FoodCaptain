<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - CampusFood</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/signup.js" defer></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>CampusFood</h1>
        </header>
        <section id="auth-section">
            <h2>Create Account</h2>
            <p>Sign up to manage your holiday meal selections.</p>
            <input type="email" id="email" placeholder="Email Address">
            <input type="password" id="password" placeholder="Password (min 6 characters)">
            <button id="signup-btn">Sign Up</button>
            <a href="login.html" class="auth-link">Already have an account? Sign In</a>
        </section>
    </div>
</body>
</html>
